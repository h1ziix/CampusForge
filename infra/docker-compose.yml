# CampusForge local development infrastructure
# Usage: docker compose -f infra/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusforge
      POSTGRES_PASSWORD: campusforge
      POSTGRES_DB: campusforge
    ports:
      - "5432:5432"
    volumes:
      - campusforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - campusforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: campusforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - campusforge_minio:/data

volumes:
  campusforge_pgdata:
  campusforge_redis:
  campusforge_minio:
