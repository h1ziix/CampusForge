name: R1 quality and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:65432/synthetic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Reproduce locked install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client without database mutations
        run: pnpm db:generate
      - name: Validate Prisma schema with synthetic configuration
        run: pnpm db:validate
      - name: Typecheck every workspace package
        run: pnpm typecheck
      - name: Lint source and regression fixtures
        run: pnpm lint
      - name: Check source formatting
        run: pnpm format:check
      - name: Prove quality gates reject deliberate stdin violations
        run: node scripts/probe-quality-gates.mjs
      - name: Install Chromium for actual Next runtime regression
        run: pnpm exec playwright install --with-deps chromium
      - name: Execute all package regressions including browser Server Action
        run: pnpm test
      - name: Verify strict Turbo environment propagation with synthetic values
        run: pnpm env:probe
      - name: Build packages, worker and web in declared order
        run: pnpm build
      - name: Install and load the production-only release
        run: |
          node scripts/package-release.mjs "$RUNNER_TEMP/campusforge-r1-release"
          pnpm --dir "$RUNNER_TEMP/campusforge-r1-release" install --prod --frozen-lockfile --ignore-scripts
          node scripts/probe-release.mjs "$RUNNER_TEMP/campusforge-r1-release" --ui-output test-results/r1-production
      - name: Preserve failing browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r1-browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
